name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            experience/package-lock.json
      - run: npm ci
      - run: npm ci --prefix experience
      - run: npm run format:check
      - run: npm run build
